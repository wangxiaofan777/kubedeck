{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kubedeck.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedeck.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  KUBEDECK_DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.masterKey }}
  KUBEDECK_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  {{- end }}
  {{- if .Values.secrets.previousMasterKey }}
  KUBEDECK_PREVIOUS_MASTER_KEY: {{ .Values.secrets.previousMasterKey | quote }}
  {{- end }}
  {{- if .Values.secrets.previousMasterKeyVersion }}
  KUBEDECK_PREVIOUS_MASTER_KEY_VERSION: {{ .Values.secrets.previousMasterKeyVersion | quote }}
  {{- end }}
  {{- if .Values.secrets.oidcClientSecret }}
  KUBEDECK_OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.secrets.bootstrapToken }}
  KUBEDECK_BOOTSTRAP_TOKEN: {{ .Values.secrets.bootstrapToken | quote }}
  {{- end }}
{{- end }}