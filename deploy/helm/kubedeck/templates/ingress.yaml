{{- if .Values.ingress.enabled -}}
{{- /* networking.k8s.io/v1 自 1.19 起提供；1.18 只有 v1beta1，backend 结构也不同。 */}}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.Version }}
apiVersion: networking.k8s.io/v1
{{- else }}
apiVersion: networking.k8s.io/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ include "kubedeck.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedeck.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
            {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.Version }}
              service:
                name: {{ include "kubedeck.fullname" $ }}
                port:
                  name: http
            {{- else }}
              serviceName: {{ include "kubedeck.fullname" $ }}
              servicePort: http
            {{- end }}
          {{- end }}
    {{- end }}
{{- end }}