name: kubedeck

# 单机部署（MySQL 8 变体）：应用固定单副本。
# 会话保存在进程内存，后台任务没有选主；多副本请使用 Helm/Kubernetes。
# PostgreSQL 仍是默认路径，见 docker-compose.yml。
services:
  kubedeck:
    image: ${KUBEDECK_IMAGE:-kubedeck:local}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      KUBEDECK_ADDR: ":8080"
      KUBEDECK_LOG_LEVEL: ${KUBEDECK_LOG_LEVEL:-info}
      KUBEDECK_DB_DRIVER: mysql
      KUBEDECK_DATABASE_URL: mysql://${MYSQL_USER:-kubedeck}:${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}@db:3306/${MYSQL_DATABASE:-kubedeck}
      KUBEDECK_MASTER_KEY: ${KUBEDECK_MASTER_KEY:?set KUBEDECK_MASTER_KEY in .env}
      KUBEDECK_MASTER_KEY_VERSION: ${KUBEDECK_MASTER_KEY_VERSION:-1}
      KUBEDECK_OIDC_ISSUER: ${KUBEDECK_OIDC_ISSUER:?set KUBEDECK_OIDC_ISSUER in .env}
      KUBEDECK_OIDC_CLIENT_ID: ${KUBEDECK_OIDC_CLIENT_ID:?set KUBEDECK_OIDC_CLIENT_ID in .env}
      KUBEDECK_OIDC_CLIENT_SECRET: ${KUBEDECK_OIDC_CLIENT_SECRET:?set KUBEDECK_OIDC_CLIENT_SECRET in .env}
      KUBEDECK_OIDC_REDIRECT_URL: ${KUBEDECK_OIDC_REDIRECT_URL:?set KUBEDECK_OIDC_REDIRECT_URL in .env}
      KUBEDECK_OIDC_SCOPES: ${KUBEDECK_OIDC_SCOPES:-openid,profile,email,groups}
      KUBEDECK_BOOTSTRAP_TOKEN: ${KUBEDECK_BOOTSTRAP_TOKEN:-}
      KUBEDECK_COOKIE_INSECURE: ${KUBEDECK_COOKIE_INSECURE:-false}
      KUBEDECK_SESSION_TTL_HOURS: ${KUBEDECK_SESSION_TTL_HOURS:-8}
      KUBEDECK_MAX_SESSIONS_PER_USER: ${KUBEDECK_MAX_SESSIONS_PER_USER:-5}
      KUBEDECK_ALLOWED_ORIGINS: ${KUBEDECK_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  db:
    image: mysql:8.0
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 审计只追加依赖触发器；开启 binlog 时创建触发器需要该开关。
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kubedeck}
      MYSQL_USER: ${MYSQL_USER:-kubedeck}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysqldata:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    shm_size: 256mb
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      kubedeck:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KUBEDECK_DOMAIN: ${KUBEDECK_DOMAIN:?set KUBEDECK_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

volumes:
  mysqldata:
  caddy_data:
  caddy_config:

networks:
  internal: