{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubedeck.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubedeck.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubedeck.fullname" . }}-impersonator
  labels:
    {{- include "kubedeck.labels" . | nindent 4 }}
rules:
  # 平台唯一的集群级权限：以最终用户/组/ServiceAccount 身份访问 apiserver。
  # 权限判定由 apiserver 完成，平台不维护第二套权限表。
  - apiGroups:
      - ""
    resources:
      - users
      - groups
      - serviceaccounts
    verbs:
      - impersonate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubedeck.fullname" . }}-impersonator
  labels:
    {{- include "kubedeck.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubedeck.fullname" . }}-impersonator
subjects:
  - kind: ServiceAccount
    name: {{ include "kubedeck.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}