name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kubedeck
          POSTGRES_PASSWORD: kubedeck_ci
          POSTGRES_DB: kubedeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kubedeck -d kubedeck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KUBEDECK_TEST_DATABASE_URL: postgres://kubedeck:kubedeck_ci@127.0.0.1:5432/kubedeck_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: gofmt
        run: |
          files=$(gofmt -l cmd internal)
          if [ -n "$files" ]; then echo "gofmt required for:"; echo "$files"; exit 1; fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: vet
        run: go vet ./cmd/... ./internal/...

      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          staticcheck ./cmd/... ./internal/...

      - name: build
        run: go build ./cmd/... ./internal/...

      - name: test
        run: go test -race -count=1 ./cmd/... ./internal/...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: lint
        working-directory: web
        run: npm run lint

      - name: format check
        working-directory: web
        run: npm run format:check

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: build
        working-directory: web
        run: npm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: kubedeck:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max